#
# Logging profile for BULK benchmark runs (sweeps, tuning, thousands of games).
#
# NOT the default. Nothing picks this file up implicitly -- log4j only auto-loads
# "log4j.properties" -- so the ordinary developer/test experience is unchanged.
# Select it explicitly per JVM:
#
#   java -Dlog4j.configuration=file:/abs/path/Mage.Tests/src/test/resources/log4j-bench.properties ...
#
# (tools/bench-parallel.sh passes exactly that flag by default; pass --logs=default
# to it to fall back to the stock log4j.properties instead.)
#
# Why it exists: at the stock "info" level the AI search logs continuously --
# ComputerPlayer6.printBattlefieldScore, "POSSIBLE ACTION CHAINS", "Sim Prio [n]",
# "===> SELECTED ACTION" and friends fire per simulated node, not per turn --
# at roughly 400KB per 20 seconds of play. Across a few thousand games that is
# gigabytes of log nobody reads, plus the string building that produced it.
#
# Two changes vs. the stock config, both aimed at bulk runs:
#
#   1. mage.player.ai -> warn. Suppresses the search chatter at the source, so the
#      message strings are never even built. The logger name is the package, and
#      log4j levels inherit down the hierarchy, so this one line also covers the
#      fork's mage.player.ai.commander (the "commander"/"learner" bots).
#      Warnings and errors still get through untouched.
#      To bring one sub-tree back for a debugging run, add e.g.
#      log4j.logger.mage.player.ai.commander=info below.
#
#   2. Console appender only -- no magetest.log / magetestErrors.log. The parallel
#      wrapper runs N JVMs sharing one working directory (Mage.Tests, because the
#      card database path ./db/cards.h2 is resolved relative to cwd), and log4j's
#      RollingFileAppender has no cross-process locking: N processes appending to
#      and rolling the SAME magetest.log interleave and truncate each other's
#      output. Console is per-process and the wrapper redirects each worker's
#      console to its own file, so nothing is lost -- errors included.
#
# What is deliberately NOT suppressed: mage.bench itself stays at info. Its
# deck-import auto-fix messages ("imported ... after auto-fixes: ...") are how a
# silently-substituted card printing becomes visible, and BenchGame.logger.error
# is the only place a failed game's stack trace is recorded. A sweep that hides
# those is a sweep you cannot trust.
#

#default log level and active appenders (dest for logs)
log4j.rootLogger=info, console

#custom log level for java classes
log4j.logger.com.j256.ormlite=warn
log4j.logger.mage.player.ai=warn
#the harness's own logging stays visible -- see the header comment
log4j.logger.mage.bench=info

#console log
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
