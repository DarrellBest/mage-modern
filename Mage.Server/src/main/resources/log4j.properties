#default settings (uses for SERVER run)

#default log level and active appenders (dest for logs)
log4j.rootLogger=info, console, logfile

#custom log level for java classes
log4j.logger.com.j256.ormlite=warn
log4j.logger.mage.player.ai=warn

#console log
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n

#file log - without rolling
log4j.appender.logfile=org.apache.log4j.FileAppender
log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
log4j.appender.logfile.File=mageserver.log

#file log - rolling by index
log4j.appender.logfileByIndex=org.apache.log4j.RollingFileAppender
log4j.appender.logfileByIndex.layout=org.apache.log4j.PatternLayout
log4j.appender.logfileByIndex.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
log4j.appender.logfileByIndex.File=mageserver.log
log4j.appender.logfileByIndex.MaxFileSize=10MB
log4j.appender.logfileByIndex.MaxBackupIndex=5
log4j.appender.logfileByIndex.append=true

#file log - rolling by dayly
log4j.appender.logfileByDayly=org.apache.log4j.DailyRollingFileAppender
log4j.appender.logfileByDayly.layout=org.apache.log4j.PatternLayout
log4j.appender.logfileByDayly.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
log4j.appender.logfileByDayly.File=mageserver.log
log4j.appender.logfileByDayly.DatePattern='.'yyyy-MM-dd

# DARRELLBEST-FORK: machine-readable AI audit stream -- one JSON object per decision, one
# FEATURES row per seat per turn, one RESULT per finished game.
#
# THIS BLOCK MUST LIVE HERE, not in config/log4j.properties. That file's own first line says
# "you must enable it by command line", and start-fork.sh passes no -Dlog4j.configuration, so
# log4j loads THIS copy from inside mage-server.jar and the config/ one is never read. The audit
# block sat in config/ for days having no effect: ai-audit.jsonl was never created and every
# record fell through to mageserver.log under the root logger's pattern, where the trailing
# "  =>[GAME id] AuditLog.event" has to be regex-stripped before the JSON will parse.
#
# Sizing: a four-player game emits a FEATURES row per seat per turn plus a row per decision.
# 100MB x 5 keeps months of real games, and matters because the offline trainer needs WHOLE
# matches -- a rotation that cuts a game in half yields trajectories with no RESULT to label them.
log4j.logger.mage.ai.audit=info, aiaudit
log4j.additivity.mage.ai.audit=false
log4j.appender.aiaudit=org.apache.log4j.RollingFileAppender
log4j.appender.aiaudit.File=ai-audit.jsonl
log4j.appender.aiaudit.MaxFileSize=100MB
log4j.appender.aiaudit.MaxBackupIndex=5
log4j.appender.aiaudit.append=true
log4j.appender.aiaudit.layout=org.apache.log4j.PatternLayout
log4j.appender.aiaudit.layout.ConversionPattern=%m%n